version: "3.8"

services:
  tw-counter:
    build:
      context: https://github.com/Loki-Deus/TW_Counter.git
      dockerfile: Dockerfile
    image: tw-counter:latest
    container_name: tw-counter
    restart: unless-stopped
    depends_on:
      - comlink
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GUILD_ID=${GUILD_ID}
      - SPECIALIST_ROLE_ID=${SPECIALIST_ROLE_ID}
      - MEMBER_ROLE_ID=${MEMBER_ROLE_ID}
      - MANAGER_IDS=${MANAGER_IDS}
      - OWNER_ID=${OWNER_ID}
      - DATA_DIR=/app/data
      - BOT_TIMEZONE=${BOT_TIMEZONE:-Europe/Vienna}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # comlink ist im selben Compose-Netzwerk über den Service-Namen
      # erreichbar -- hartkodiert wie DATA_DIR oben, nicht per .env
      # überschreibbar, muss zum Service-Namen unten passen bleiben.
      - COMLINK_URL=http://comlink:3000
    volumes:
      - tw-counter-data:/app/data

  tb-reminder:
    build:
      context: https://github.com/Loki-Deus/TB_Reminder.git
      dockerfile: Dockerfile
    image: tb-reminder:latest
    container_name: tb-reminder
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${TB_DISCORD_TOKEN}
      # Geteilt mit tw-counter -- derselbe Discord-Server, siehe .env.example.
      - GUILD_ID=${GUILD_ID}
      - TW_CHANNEL_ID=${TW_CHANNEL_ID}
      - OFFICER_ID=${OFFICER_ID}
      - MANAGER_IDS=${TB_MANAGER_IDS}
      - MEMBER_ROLE_ID=${TB_MEMBER_ROLE_ID}
      - DATA_DIR=/app/data
      - BOT_TIMEZONE=${BOT_TIMEZONE:-Europe/Vienna}
      # Read-only Zugriff auf tw-counters Roster-Mirror (players,
      # roster_units, unit_names) für /tbreminder_platoons_check und
      # /tbreminder_platoons_ping -- siehe volumes unten. Hartkodiert wie
      # COMLINK_URL oben, muss zum :ro-Mount-Pfad passen bleiben.
      - ROSTER_DB_PATH=/app/roster-data/counters.db
    volumes:
      - tb-stats:/app/data
      # :ro -- tb-reminder liest tw-counters Datenbank nur, schreibt nie.
      # Ein Bug hier kann damit tw-counters Daten strukturell nicht
      # beschädigen, unabhängig vom Code-Zustand in tb-reminder.
      - tw-counter-data:/app/roster-data:ro

  # Selbst gehostete swgoh-comlink-Instanz (siehe roster.py) -- kein
  # Port-Mapping nach außen, nur tw-counter im internen Compose-Netzwerk
  # muss diesen Dienst erreichen können. tb-reminder spricht comlink NICHT
  # direkt an -- es liest ausschließlich den bereits von tw-counter
  # gepflegten Roster-Mirror (siehe oben), keine zweite Comlink-Abhängigkeit.
  comlink:
    image: ghcr.io/swgoh-utils/swgoh-comlink:latest
    container_name: tw-counter-comlink
    restart: unless-stopped
    environment:
      - APP_NAME=${COMLINK_APP_NAME:-tw-counter-bot}

volumes:
  tw-counter-data:
    external: true
    name: tw_counter_tw-counter-data
  # Wiederverwendung des bereits bestehenden TB-Reminder-Volumes --
  # dieselbe externe Volume-Referenz wie im bisherigen eigenständigen
  # tb-reminder-Stack, keine neue Volume-Erzeugung, keine Datenmigration.
  tb-stats:
    external: true
    name: tb_reminder_tb-stats
